<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0b0e14;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 82px 96px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    left: -300px; top: -420px;
    width: 1250px; height: 900px;
    background: radial-gradient(ellipse at center, rgba(232,80,31,.36), transparent 62%);
  }
  .row { display: flex; align-items: center; gap: 22px; position: relative; }
  .row svg { width: 92px; height: 92px; }
  .name { font-size: 60px; font-weight: 700; letter-spacing: -2px; }
  .name span { color: #ff7a45; }
  h1 {
    position: relative;
    margin-top: auto;
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -2.4px;
    line-height: 1.13;
    max-width: 20ch;
  }
  p { position: relative; margin-top: 26px; font-size: 27px; color: #a3adbf; }
  .bar { position: relative; margin-top: auto; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #ff6a3d, #f5a524); }
</style>
<div class="row">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#f5a524"/>
    </linearGradient></defs>
    <rect width="64" height="64" rx="15" fill="url(#g)"/>
    <path fill="#fff" fill-rule="evenodd" d="M32 8c8.5 12 13.5 19 13.5 26.5a13.5 13.5 0 0 1-27 0C18.5 27 23.5 20 32 8zm0 22c3.6 5.2 5.6 8.2 5.6 11a5.6 5.6 0 0 1-11.2 0c0-2.8 2-5.8 5.6-11z"/>
  </svg>
  <div class="name">Cyber<span>Fenix</span></div>
</div>
<h1>Browser tools that do the tedious part of your inbox.</h1>
<p>Private by design · Nothing leaves your device · Open source</p>
<div class="bar"></div>
