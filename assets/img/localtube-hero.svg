<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img"
     aria-label="A YouTube homepage showing only videos from followed channels, with a LocalTube section in the sidebar">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" rx="18" fill="#0f0f0f"/>

  <!-- masthead -->
  <rect x="0" y="0" width="1280" height="64" rx="18" fill="#181818"/>
  <rect x="0" y="46" width="1280" height="18" fill="#181818"/>
  <g fill="#3f3f3f">
    <rect x="28" y="27" width="20" height="3" rx="1.5"/>
    <rect x="28" y="34" width="20" height="3" rx="1.5"/>
    <rect x="28" y="20" width="20" height="3" rx="1.5"/>
  </g>
  <rect x="66" y="22" width="86" height="20" rx="5" fill="#2c2c2c"/>
  <rect x="430" y="18" width="330" height="28" rx="14" fill="#121212" stroke="#303030"/>

  <!-- sidebar -->
  <g fill="#2c2c2c">
    <rect x="24" y="92" width="150" height="12" rx="6"/>
    <rect x="24" y="124" width="120" height="12" rx="6"/>
    <rect x="24" y="156" width="136" height="12" rx="6"/>
  </g>
  <rect x="24" y="196" width="176" height="1" fill="#303030"/>
  <text x="24" y="224" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="600" fill="url(#brand)">LOCALTUBE</text>
  <rect x="16" y="238" width="184" height="30" rx="9" fill="#272727"/>
  <text x="28" y="258" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#f1f1f1">My feed</text>
  <text x="28" y="292" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#aaa">Following</text>
  <text x="28" y="326" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#aaa">Playlists</text>

  <!-- chips -->
  <rect x="240" y="92" width="88" height="30" rx="15" fill="#f1f1f1"/>
  <text x="266" y="112" font-family="Roboto, Arial, sans-serif" font-size="14" font-weight="500" fill="#0f0f0f">Feed</text>
  <rect x="340" y="92" width="132" height="30" rx="15" fill="#272727"/>
  <text x="360" y="112" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#f1f1f1">Subscriptions</text>
  <rect x="484" y="92" width="102" height="30" rx="15" fill="#272727"/>
  <text x="506" y="112" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#f1f1f1">Playlists</text>

  <!-- video grid -->
  <g>
    <g transform="translate(240,152)">
      <rect width="316" height="178" rx="12" fill="#272727"/>
      <path d="M143 78v22l19-11z" fill="#4a4a4a"/>
      <rect y="194" width="250" height="12" rx="6" fill="#3a3a3a"/>
      <rect y="216" width="170" height="10" rx="5" fill="#2c2c2c"/>
    </g>
    <g transform="translate(580,152)">
      <rect width="316" height="178" rx="12" fill="#272727"/>
      <path d="M143 78v22l19-11z" fill="#4a4a4a"/>
      <rect y="194" width="286" height="12" rx="6" fill="#3a3a3a"/>
      <rect y="216" width="150" height="10" rx="5" fill="#2c2c2c"/>
    </g>
    <g transform="translate(920,152)">
      <rect width="316" height="178" rx="12" fill="#272727"/>
      <path d="M143 78v22l19-11z" fill="#4a4a4a"/>
      <rect y="194" width="212" height="12" rx="6" fill="#3a3a3a"/>
      <rect y="216" width="182" height="10" rx="5" fill="#2c2c2c"/>
    </g>

    <g transform="translate(240,406)">
      <rect width="316" height="178" rx="12" fill="#272727"/>
      <path d="M143 78v22l19-11z" fill="#4a4a4a"/>
      <rect y="194" width="272" height="12" rx="6" fill="#3a3a3a"/>
      <rect y="216" width="160" height="10" rx="5" fill="#2c2c2c"/>
    </g>
    <g transform="translate(580,406)">
      <rect width="316" height="178" rx="12" fill="#272727"/>
      <path d="M143 78v22l19-11z" fill="#4a4a4a"/>
      <rect y="194" width="196" height="12" rx="6" fill="#3a3a3a"/>
      <rect y="216" width="176" height="10" rx="5" fill="#2c2c2c"/>
    </g>
    <g transform="translate(920,406)">
      <rect width="316" height="178" rx="12" fill="#272727"/>
      <path d="M143 78v22l19-11z" fill="#4a4a4a"/>
      <rect y="194" width="258" height="12" rx="6" fill="#3a3a3a"/>
      <rect y="216" width="140" height="10" rx="5" fill="#2c2c2c"/>
    </g>
  </g>

  <!-- signed-out callout -->
  <g transform="translate(240,650)">
    <rect width="996" height="86" rx="14" fill="#161616" stroke="#303030"/>
    <circle cx="46" cy="43" r="18" fill="url(#brand)"/>
    <path d="M40 35v16l13-8z" fill="#fff"/>
    <text x="82" y="38" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="500" fill="#f1f1f1">Not signed in — and it still knows what you follow.</text>
    <text x="82" y="63" font-family="Roboto, Arial, sans-serif" font-size="14" fill="#aaa">Your channels, playlists and likes live in this browser. Nothing is sent anywhere.</text>
  </g>
</svg>
